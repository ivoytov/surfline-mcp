[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "surfline-mcp"
version = "0.1.0"
description = "Minimal MCP server for Surfline conditions and ratings forecast"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.0.0",
]

[project.scripts]
surfline-mcp = "surfline_mcp.server:main"
